[mod-setting-name]
spt-upkeep-power=[item=space-power-transmitter] Transmitter upkeep power (kW)

[mod-setting-description]
spt-upkeep-power=Upkeep power the transmitter draws from the local network to keep its grid link alive, in kW. Quality tiers draw 5/6, 4/6, 3/6 and 1/6 of it (uncommon, rare, epic, legendary). Requires a restart. Range: 6 MW - 1 GW.

[entity-name]
space-power-transmitter=Space Power Transmitter

[entity-description]
space-power-transmitter=Links this surface's power network to the common space power grid. Energy flows both ways between all linked surfaces of the force - through space, over any distance (moving space platforms included) - and is rationed by demand when production falls short. Draws __1__ of upkeep (uncommon, rare, epic and legendary draw 5/6, 4/6, 3/6 and 1/6 of it). If the local network cannot supply that much power, the link drops and no energy is transferred; it is restored automatically once the network can supply the upkeep again.

[item-name]
space-power-transmitter=Space Power Transmitter

[item-description]
space-power-transmitter=Links the local power grid to the common space power grid: moves energy through space over any distance (moving space platforms included). Draws __1__ of upkeep; quality tiers draw 5/6, 4/6, 3/6 and 1/6 of it (500, 400, 300 and 100 MW at the default 600 MW).

[technology-name]
space-power-transmitter=Space Power Transmitter

[technology-description]
space-power-transmitter=Unlocks the Space Power Transmitter: links a planet or space platform (even a moving one) to the common space power grid over any distance, at a constant upkeep drain.

[spt-port]
port-upkeep=Space Power Transmitter (upkeep)
port-import=Space Power Transmitter (import)
port-export=Space Power Transmitter (export)
port-description=Internal port of the Space Power Transmitter.

[spt-alert]
link-dropped=Space power link dropped: the local network does not produce enough power for the transmitter's upkeep. The link will be restored automatically once enough power is available again.

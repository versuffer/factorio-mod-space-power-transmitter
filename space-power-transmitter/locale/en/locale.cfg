[mod-setting-name]
spt-upkeep-power=[item=space-power-transmitter] Transmitter upkeep power (kW)

[mod-setting-description]
spt-upkeep-power=Upkeep power the transmitter draws from the local network to keep its grid link alive, in kW. Quality tiers draw 5/6, 4/6, 3/6 and 1/6 of it (uncommon, rare, epic, legendary). Requires a restart. Range: 6 MW - 1 GW.

[entity-name]
space-power-transmitter=Space Power Transmitter

[entity-description]
space-power-transmitter=Links this surface's power network to the common space power grid. Energy flows both ways between all linked surfaces of the force - through space, over any distance (moving space platforms included) - and is rationed by demand when production falls short. Draws __1__ of upkeep (uncommon, rare, epic and legendary draw 5/6, 4/6, 3/6 and 1/6 of it). If the local network cannot supply that much power, the link drops and no energy is transferred; it is restored automatically once the network can supply the upkeep again. Wired into a circuit network, the transmitter broadcasts its link status: [virtual-signal=spt-link-up] is 1 while the link is healthy, [virtual-signal=spt-link-failing] is 1 while the link is about to drop, and both absent means the link is down. An "Enable if" circuit condition switches the transmitter off entirely - no link, no upkeep drain - while it is false.

[item-name]
space-power-transmitter=Space Power Transmitter

[item-description]
space-power-transmitter=Links the local power grid to the common space power grid: moves energy through space over any distance (moving space platforms included). Draws __1__ of upkeep; quality tiers draw 5/6, 4/6, 3/6 and 1/6 of it (500, 400, 300 and 100 MW at the default 600 MW).

[technology-name]
space-power-transmitter=Space Power Transmitter

[technology-description]
space-power-transmitter=Unlocks the Space Power Transmitter: links a planet or space platform (even a moving one) to the common space power grid over any distance, at a constant upkeep drain.

[spt-port]
port-upkeep=Space Power Transmitter (upkeep)
port-import=Space Power Transmitter (import)
port-export=Space Power Transmitter (export)
port-description=Internal port of the Space Power Transmitter.

[spt-alert]
link-dropped=Space power link dropped: the local network does not produce enough power for the transmitter's upkeep. The link will be restored automatically once enough power is available again.

[virtual-signal-name]
spt-link-up=Space power link up
spt-link-failing=Space power link failing

[virtual-signal-description]
spt-link-up=Outputs 1 while this transmitter holds a healthy link to the space power grid. When neither this signal nor [virtual-signal=spt-link-failing] is present, the link is down.
spt-link-failing=Outputs 1 while the link is still up, but the local network has stopped paying the upkeep: the link will drop within seconds unless enough power becomes available. When neither this signal nor [virtual-signal=spt-link-up] is present, the link is down.

[spt-enable]
title=Enable if
signal-tooltip=The signal to watch on this transmitter's circuit network. Leave empty to keep the transmitter always enabled.
comparator-tooltip=The comparison applied to the signal.
constant-tooltip=The constant the signal value is compared against. An empty field counts as zero.
clear=Clear
clear-tooltip=Remove the condition: the transmitter is always enabled.
wire-in=In
wire-in-tooltip=The wire color watched by the Enable if condition. Both reads red and green summed.
wire-out=Out
wire-out-tooltip=The wire color the status signals are broadcast on.
wire-both=Both
wire-red=Red
wire-green=Green
